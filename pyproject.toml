[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openserv-sdk"
dynamic = ["version"]
description = "OpenServ Agent library for building AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "OpenServ Labs", email = "support@openserv.ai" }
]
keywords = ["ai", "agent", "openserv", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "aiohttp>=3.8.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "black>=23.9.1",
    "isort>=5.12.0",
    "mypy>=1.5.1",
    "pre-commit>=3.4.0"
]

[project.urls]
Homepage = "https://github.com/openserv-labs/python-sdk"
Documentation = "https://docs.openserv.ai/resources/python-sdk"
Repository = "https://github.com/openserv-labs/python-sdk.git"
Issues = "https://github.com/openserv-labs/python-sdk/issues"

[tool.hatch.version]
path = "src/openserv_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openserv_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/openserv_sdk",
    "/tests",
    "/examples"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test"
]
addopts = [
    "--verbose",
    "--cov=openserv_sdk",
    "--cov-report=term-missing",
    "--cov-report=html"
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
env_files = [".env.test"]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100 